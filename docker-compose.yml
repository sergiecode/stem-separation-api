version: '3.8'

services:
  stem-api:
    build: .
    container_name: stem-separation-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PYTHON_PATH=python3
      - SEPARATOR_PROJECT_PATH=/app/audio-stem-separator
      - MAX_FILE_SIZE=524288000
      - PROCESSING_TIMEOUT=600000
      - LOG_LEVEL=info
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - logs_data:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: stem-api-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - outputs_data:/var/www/outputs:ro
    depends_on:
      - stem-api
    restart: unless-stopped

volumes:
  uploads_data:
  outputs_data:
  logs_data:
